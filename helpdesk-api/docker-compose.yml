services:
  app:
    build: .
    container_name: helpdesk_app
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html

    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: helpdesk_api_db
      DB_USERNAME: laravel
      DB_PASSWORD: tororo5nbu
      
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: helpdesk_db
    environment:
      MYSQL_DATABASE: helpdesk_api_db
      MYSQL_ROOT_PASSWORD: tororo5nbu
      MYSQL_USER: laravel
      MYSQL_PASSWORD: tororo5nbu
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data: